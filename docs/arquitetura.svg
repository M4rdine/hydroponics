<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img">
<defs>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1f2a24" opacity=".10"/></pattern>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2a24"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d4f"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b7a9b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c8402f"/></marker>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#1f2a24;font-size:12px}
.h{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:700;font-size:24px}
.sub{fill:#5d6b62;font-size:13px}
.b{font-weight:700}
.tag{font-weight:700;font-size:11px;letter-spacing:1.5px}
.m{fill:#5d6b62}
.w{fill:#fff}
.s{font-size:11px}
.c{text-anchor:middle}
.e{text-anchor:end}
.wire{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style>
</defs>
<rect width="1200" height="530" rx="18" fill="#f4f1e8"/>
<rect width="1200" height="530" rx="18" fill="url(#dots)"/>
<text x="40" y="52" class="h">Arquitetura</text>
<text x="40" y="76" class="sub">o ciclo da bomba roda dentro do ESP32; a nuvem serve só para ver e comandar de longe</text>
<rect x="30" y="100" width="490" height="400" rx="14" fill="#fbfaf5" stroke="#1f2a24" stroke-width="1.2" stroke-dasharray="6 6"/>
<text x="50" y="126" class="tag">SUA CASA · REDE LOCAL</text>
<text x="130" y="158" class="c s">torre · 30 cavidades</text>
<rect x="62" y="390" width="136" height="70" rx="8" fill="#cfe4ec" stroke="#1f2a24" stroke-width="1.5"/>
<rect x="112" y="170" width="36" height="222" rx="10" fill="#e3ebdf" stroke="#1f2a24" stroke-width="1.5"/>
<ellipse cx="104" cy="200" rx="13" ry="10" fill="#2e7d4f"/>
<ellipse cx="156" cy="240" rx="13" ry="10" fill="#2e7d4f"/>
<ellipse cx="104" cy="280" rx="13" ry="10" fill="#2e7d4f"/>
<ellipse cx="156" cy="320" rx="13" ry="10" fill="#2e7d4f"/>
<ellipse cx="104" cy="360" rx="13" ry="10" fill="#2e7d4f"/>
<rect x="118" y="424" width="24" height="24" rx="4" fill="#1f2a24"/>
<text x="76" y="412" class="s b">10 L</text>
<text x="130" y="480" class="c s">bomba submersa 12 V</text>
<rect x="280" y="160" width="210" height="112" rx="10" fill="#1f2a24"/>
<text x="300" y="196" class="w b" style="font-size:20px">ESP32</text>
<text x="300" y="217" fill="#b9d8c4">firmware ESPHome</text>
<text x="300" y="242" class="w s">conta o tempo e aciona</text>
<text x="300" y="258" class="w s">a bomba sozinho</text>
<rect x="280" y="330" width="210" height="64" rx="10" fill="#fff" stroke="#1f2a24" stroke-width="1.5"/>
<text x="300" y="357" class="b" style="font-size:15px">Relé</text>
<text x="300" y="378" class="s">liga/desliga a bomba</text>
<line x1="385" y1="272" x2="385" y2="328" stroke="#1f2a24" stroke-width="2" marker-end="url(#a-ink)"/>
<text x="395" y="306" class="s">GPIO26</text>
<path d="M280 362H222V436H146" class="wire" stroke="#c8402f" stroke-width="2.5" marker-end="url(#a-red)"/>
<line x1="150" y1="212" x2="278" y2="212" stroke="#1f2a24" stroke-width="2" marker-end="url(#a-ink)"/>
<text x="214" y="203" class="c s">sensores</text>
<text x="285" y="430" class="s m">dashboard local, sem internet:</text>
<text x="285" y="447" class="s b">http://torre-hidroponica.local</text>
<text x="610" y="172" class="c b" fill="#2e7d4f" style="font-size:13px">MQTT + TLS</text>
<text x="610" y="190" class="c s" fill="#2e7d4f">porta 8883</text>
<text x="610" y="228" class="c s m">conexão de SAÍDA:</text>
<text x="610" y="244" class="c s m">nenhuma porta aberta</text>
<text x="610" y="260" class="c s m">no roteador</text>
<rect x="700" y="100" width="470" height="400" rx="14" fill="#fbfaf5" stroke="#1f2a24" stroke-width="1.2" stroke-dasharray="6 6"/>
<text x="720" y="126" class="tag">VPS · DOCKER COMPOSE</text>
<line x1="490" y1="205" x2="728" y2="205" stroke="#2e7d4f" stroke-width="2.5" marker-end="url(#a-green)"/>
<rect x="730" y="160" width="180" height="90" rx="10" fill="#2e7d4f"/>
<text x="748" y="196" class="w b" style="font-size:17px">Mosquitto</text>
<text x="748" y="217" class="w">broker MQTT</text>
<text x="748" y="236" class="w s">usuário + senha + ACL</text>
<rect x="960" y="160" width="180" height="90" rx="10" fill="#2b7a9b"/>
<text x="976" y="196" class="w b" style="font-size:16px">Home Assistant</text>
<text x="976" y="217" class="w s">histórico, gráficos</text>
<text x="976" y="234" class="w s">e automações</text>
<line x1="958" y1="205" x2="912" y2="205" stroke="#1f2a24" stroke-width="2" marker-end="url(#a-ink)" marker-start="url(#a-ink)"/>
<text x="935" y="195" class="c s">1883</text>
<text x="935" y="226" class="c s m">interno</text>
<rect x="960" y="350" width="180" height="80" rx="10" fill="#fff" stroke="#1f2a24" stroke-width="1.5"/>
<text x="976" y="382" class="b" style="font-size:16px">nginx</text>
<text x="976" y="404" class="s">HTTPS · Let's Encrypt</text>
<line x1="1050" y1="350" x2="1050" y2="252" stroke="#1f2a24" stroke-width="2" marker-end="url(#a-ink)"/>
<text x="1060" y="306" class="s">127.0.0.1:8123</text>
<text x="720" y="478" class="s m">exposto à internet: só 8883 (MQTT) e 443 (HTTPS)</text>
<rect x="545" y="350" width="130" height="80" rx="12" fill="#1f2a24"/>
<text x="562" y="380" class="w b" style="font-size:16px">Você</text>
<text x="562" y="400" class="w s">celular ou</text>
<text x="562" y="416" class="w s">notebook</text>
<line x1="675" y1="390" x2="958" y2="390" stroke="#2b7a9b" stroke-width="2.5" marker-end="url(#a-blue)"/>
<text x="820" y="380" class="c s b" fill="#2b7a9b">HTTPS :443 · de qualquer lugar</text>
</svg>
