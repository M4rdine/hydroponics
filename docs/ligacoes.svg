<text x="820" y="602" class="s">• analógicos só nos GPIO 32–39 (ADC1):</text>
<text x="834" y="618" class="s">o ADC2 para de ler com o Wi-Fi ligado</text>
<text x="820" y="634" class="s">• GPIO 34–39 são só entrada</text>
