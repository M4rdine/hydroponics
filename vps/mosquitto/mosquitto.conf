persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Sem acesso anonimo: usuarios em passwd (gerado na VPS, fora do git)
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Interno: so o Home Assistant, pela rede do compose (porta nao publicada)
listener 1883

# Externo: ESP32 pela internet, sempre com TLS
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
