# Duracao das fases do ciclo em SEGUNDOS.
# FASE TRANSPLANTE (ate ~20/08): 900/900 (15min/15min).
# Apos enraizamento: fase_desligada_s -> "1800" (15min on / 30min off)
substitutions:
  fase_ligada_s: "900"
  fase_desligada_s: "900"

esphome:
  name: torre-hidroponica
  friendly_name: Torre Hidroponica

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Se nao conseguir conectar no WiFi, cria uma rede propria de emergencia
  ap:
    ssid: "Torre-Hidroponica"
    password: !secret ap_password

# Chave e senhas ficam no secrets.yaml (fora do git; modelo em secrets.example.yaml)
api:
  encryption:
    key: !secret api_encryption_key
  # Sem isto o ESP32 reinicia a cada 15min quando nenhum cliente usa a API
  # (o HA agora fala por MQTT) - e cada reboot reinicia o ciclo da bomba
  reboot_timeout: 0s

# Broker Mosquitto na VPS (vps/), sempre com TLS
mqtt:
  broker: !secret mqtt_broker
  port: 8883
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  # Internet caiu? Segue irrigando, sem reiniciar
  reboot_timeout: 0s
  skip_cert_cn_check: false
  idf_send_async: false
